<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#101623"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <!-- background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <!-- penguin body -->
  <ellipse cx="256" cy="310" rx="140" ry="150" fill="#1b2437" stroke="url(#acc)" stroke-width="6"/>
  <!-- belly -->
  <ellipse cx="256" cy="350" rx="80" ry="100" fill="#151d2e"/>
  <!-- eyes -->
  <circle cx="210" cy="200" r="28" fill="url(#acc)"/>
  <circle cx="302" cy="200" r="28" fill="url(#acc)"/>
  <circle cx="218" cy="195" r="12" fill="#0b0f17"/>
  <circle cx="310" cy="195" r="12" fill="#0b0f17"/>
  <circle cx="222" cy="190" r="5" fill="white" opacity="0.6"/>
  <circle cx="314" cy="190" r="5" fill="white" opacity="0.6"/>
  <!-- beak -->
  <polygon points="240,240 272,240 256,270" fill="#fbbf24"/>
  <!-- feet -->
  <ellipse cx="200" cy="455" rx="40" ry="18" fill="#fbbf24" opacity="0.8"/>
  <ellipse cx="312" cy="455" rx="40" ry="18" fill="#fbbf24" opacity="0.8"/>
  <!-- flippers -->
  <ellipse cx="115" cy="310" rx="30" ry="80" fill="#1b2437" stroke="url(#acc)" stroke-width="4" transform="rotate(15,115,310)"/>
  <ellipse cx="397" cy="310" rx="30" ry="80" fill="#1b2437" stroke="url(#acc)" stroke-width="4" transform="rotate(-15,397,310)"/>
  <!-- terminal cursor -->
  <rect x="300" y="370" width="8" height="24" rx="2" fill="#34d399" opacity="0.7">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <text x="265" y="392" fill="#34d399" font-family="monospace" font-size="28" font-weight="bold">~$</text>
</svg>
